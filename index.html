        function generateGroupMatches(groupLetter, teams) {
            const matchSpecs = [
                { round: 1, teamA: teams[0], teamB: teams[1] }, { round: 1, teamA: teams[2], teamB: teams[3] },
                { round: 2, teamA: teams[0], teamB: teams[2] }, { round: 2, teamA: teams[1], teamB: teams[3] },
                { round: 3, teamA: teams[0], teamB: teams[3] }, { round: 3, teamA: teams[1], teamB: teams[2] }
            ];
            return matchSpecs.map((spec, idx) => ({ id: `${groupLetter}-${idx + 1}`, round: spec.round, teamA: spec.teamA, teamB: spec.teamB, scoreA: null, scoreB: null, datetime: getGroupMatchDateTime(groupLetter, spec.round, idx) }));
        }

        function calculateGroupStandings(groupLetter) {
            const group = state.groups[groupLetter];
            const standings = {};
            group.teams.forEach(t => standings[t.code] = { team: t, pts: 0, j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, sg: 0 });

            group.matches.forEach(m => {
                if (m.scoreA !== null && m.scoreB !== null && m.scoreA !== "" && m.scoreB !== "") {
                    const sA = parseInt(m.scoreA); const sB = parseInt(m.scoreB);
                    const tA = standings[m.teamA.code]; const tB = standings[m.teamB.code];
                    if (tA && tB) {
                        tA.j += 1; tB.j += 1; tA.gp += sA; tA.gc += sB; tB.gp += sB; tB.gc += sA;
                        if (sA > sB) { tA.pts += 3; tA.v += 1; tB.d += 1; }
                        else if (sB > sA) { tB.pts += 3; tB.v += 1; tA.d += 1; }
                        else { tA.pts += 1; tB.pts += 1; tA.e += 1; tB.e += 1; }
                    }
                }
            });
            for (const code in standings) standings[code].sg = standings[code].gp - standings[code].gc;
            return Object.values(standings).sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts; if (b.sg !== a.sg) return b.sg - a.sg;
                if (b.gp !== a.gp) return b.gp - a.gp; if (b.v !== a.v) return b.v - a.v;
                return a.team.name.localeCompare(b.team.name);
            });
        }

        function getThirdPlacesStandings() {
            const thirds = [];
            ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'].forEach(g => {
                const sorted = calculateGroupStandings(g);
                thirds.push({ team: sorted[2].team, group: g, ...sorted[2] });
            });
            return thirds.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts; if (b.sg !== a.sg) return b.sg - a.sg;
                if (b.gp !== a.gp) return b.gp - a.gp; if (b.v !== a.v) return b.v - a.v;
                return a.group.localeCompare(b.group);
            });
        }

        function resolveKnockoutWinner(match) {
            if (match.scoreA === null || match.scoreB === null || match.scoreA === "" || match.scoreB === "") {
                match.winnerId = null; match.penA = null; match.penB = null; propagateKnockout(match.stage, match.index, null, null); return;
            }
            const sA = parseInt(match.scoreA); const sB = parseInt(match.scoreB);
            if (sA > sB) { match.winnerId = 'A'; match.penA = null; match.penB = null; propagateKnockout(match.stage, match.index, match.teamA, match.teamB); }
            else if (sB > sA) { match.winnerId = 'B'; match.penA = null; match.penB = null; propagateKnockout(match.stage, match.index, match.teamB, match.teamA); }
            else {
                if (match.penA === null || match.penB === null || match.penA === "" || match.penB === "") { match.winnerId = null; propagateKnockout(match.stage, match.index, null, null); return; }
                const pA = parseInt(match.penA); const pB = parseInt(match.penB);
                if (pA > pB) { match.winnerId = 'A'; propagateKnockout(match.stage, match.index, match.teamA, match.teamB); }
                else if (pB > pA) { match.winnerId = 'B'; propagateKnockout(match.stage, match.index, match.teamB, match.teamA); }
                else { match.winnerId = null; propagateKnockout(match.stage, match.index, null, null); }
            }
        }

        function propagateKnockout(stage, matchIndex, winnerTeam, loserTeam) {
            let targetStage = null; let targetMatchIndex = null; let targetSlot = null;
            if (stage === 'R32') { targetStage = 'R16'; targetMatchIndex = Math.floor(matchIndex / 2); targetSlot = (matchIndex % 2 === 0) ? 'A' : 'B'; }
            else if (stage === 'R16') { targetStage = 'QF'; targetMatchIndex = Math.floor(matchIndex / 2); targetSlot = (matchIndex % 2 === 0) ? 'A' : 'B'; }
            else if (stage === 'QF') { targetStage = 'SF'; targetMatchIndex = Math.floor(matchIndex / 2); targetSlot = (matchIndex % 2 === 0) ? 'A' : 'B'; }
            else if (stage === 'SF') {
                updateKnockoutSlot(state.knockout.final, (matchIndex === 0) ? 'teamA' : 'teamB', winnerTeam);
                updateKnockoutSlot(state.knockout.thirdPlace, (matchIndex === 0) ? 'teamA' : 'teamB', loserTeam);
                return;
            } else return;

            if (targetStage) updateKnockoutSlot(state.knockout[targetStage][targetMatchIndex], (targetSlot === 'A') ? 'teamA' : 'teamB', winnerTeam);
        }

        function updateKnockoutSlot(match, slotName, team) {
            const currentTeam = match[slotName];
            if (!currentTeam || !team || currentTeam.code !== team.code) {
                match[slotName] = team ? { ...team } : null;
                match.scoreA = null; match.scoreB = null; match.penA = null; match.penB = null; match.winnerId = null;
                propagateKnockout(match.stage, match.index, null, null);
            }
        }

        function simulateGroupStageMatches() {
            const weightScores = [0, 0, 1, 1, 1, 2, 2, 2, 3, 3, 4];
            ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L'].forEach(g => state.groups[g].matches.forEach(m => { m.scoreA = weightScores[Math.floor(Math.random() * weightScores.length)]; m.scoreB = weightScores[Math.floor(Math.random() * weightScores.length)]; }));
            saveState(); renderGroups(); showToast("Grupos simulados e salvos!", "success");
        }

        function showConfirm(title, desc, isDanger, onConfirm) {
            const modal = document.getElementById("confirm-modal"); const box = document.getElementById("confirm-modal-box"); const modalConfirmBtn = document.getElementById("confirm-modal-confirm"); const modalCancelBtn = document.getElementById("confirm-modal-cancel"); const modalIcon = document.getElementById("confirm-modal-icon");
            document.getElementById("confirm-modal-title").textContent = title; document.getElementById("confirm-modal-desc").textContent = desc;
            if (isDanger) { modalIcon.className = "mx-auto bg-rose-500/10 text-rose-500 p-3 rounded-full w-14 h-14 flex items-center justify-center border border-rose-500/20"; modalIcon.innerHTML = `<svg class="w-7 h-7 text-rose-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"></path></svg>`; modalConfirmBtn.className = "flex-1 px-4 py-2 text-xs font-semibold rounded-xl bg-rose-600 hover:bg-rose-500 text-white transition-all active:scale-95 shadow-md shadow-rose-600/15"; }
            else { modalIcon.className = "mx-auto bg-emerald-500/10 text-emerald-500 p-3 rounded-full w-14 h-14 flex items-center justify-center border border-emerald-500/20"; modalIcon.innerHTML = `<svg class="w-7 h-7 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>`; modalConfirmBtn.className = "flex-1 px-4 py-2 text-xs font-semibold rounded-xl bg-emerald-500 hover:bg-emerald-400 text-copaNavy-dark transition-all active:scale-95 font-bold shadow-md shadow-emerald-600/15"; }
            modal.classList.remove("hidden"); setTimeout(() => { modal.classList.remove("opacity-0"); box.classList.remove("scale-95"); modal.classList.add("opacity-100"); box.classList.add("scale-100"); }, 10);
            const cleanup = () => { modal.classList.remove("opacity-100"); box.classList.remove("scale-100"); modal.classList.add("opacity-0"); box.classList.add("scale-95"); setTimeout(() => modal.classList.add("hidden"), 300); modalConfirmBtn.onclick = null; modalCancelBtn.onclick = null; };
            modalConfirmBtn.onclick = () => { onConfirm(); cleanup(); }; modalCancelBtn.onclick = cleanup;
        }

        function renderApp() { renderGroupFilterPills(); renderGroups(); renderKnockoutTabs(); renderKnockoutBracket(); }

        function renderGameReport() {
            const container = document.getElementById("report-container");
            
            // Collect all matches from groups and knockout stages
            let allMatches = [];
            
            // Add group matches
            for (const groupLetter in state.groups) {
                state.groups[groupLetter].matches.forEach(match => {
                    allMatches.push({
                        id: match.id,
                        teamA: match.teamA,
                        teamB: match.teamB,
                        scoreA: match.scoreA,
                        scoreB: match.scoreB,
                        datetime: match.datetime,
                        stage: `Fase de Grupos - ${groupLetter}`,
                        type: 'group'
                    });
                });
            }
            
            // Add knockout matches
            ['R32', 'R16', 'QF', 'SF'].forEach(stage => {
                const stageName = {
                    'R32': 'Oitavas de Final',
                    'R16': 'Quartas de Final',
                    'QF': 'Semifinal',
                    'SF': 'Final'
                }[stage];
                
                state.knockout[stage].forEach(match => {
                    if (match.teamA && match.teamB) {
                        allMatches.push({
                            id: match.id,
                            teamA: match.teamA,
                            teamB: match.teamB,
                            scoreA: match.scoreA,
                            scoreB: match.scoreB,
                            datetime: match.datetime,
                            stage: stageName,
                            type: 'knockout'
                        });
                    }
                });
            });
            
            // Add third place and final
            if (state.knockout.thirdPlace.teamA && state.knockout.thirdPlace.teamB) {
                allMatches.push({
                    id: 'TP',
                    teamA: state.knockout.thirdPlace.teamA,
                    teamB: state.knockout.thirdPlace.teamB,
                    scoreA: state.knockout.thirdPlace.scoreA,
                    scoreB: state.knockout.thirdPlace.scoreB,
                    datetime: state.knockout.thirdPlace.datetime,
                    stage: '3º lugar',
                    type: 'knockout'
                });
            }
            
            if (state.knockout.final.teamA && state.knockout.final.teamB) {
                allMatches.push({
                    id: 'F',
                    teamA: state.knockout.final.teamA,
                    teamB: state.knockout.final.teamB,
                    scoreA: state.knockout.final.scoreA,
                    scoreB: state.knockout.final.scoreB,
                    datetime: state.knockout.final.datetime,
                    stage: 'Final',
                    type: 'knockout'
                });
            }
            
            // Parse datetime strings to sort by date and time
            const parseDateTime = (dateStr) => {
                if (!dateStr) return new Date(0);
                const parts = dateStr.split(' - ');
                if (parts.length !== 2) return new Date(0);
                const [day, month, year] = parts[0].split('/');
                const [hour, minute] = parts[1].split(':');
                return new Date(year, month - 1, day, hour, minute);
            };
            
            // Sort by date and time
            allMatches.sort((a, b) => {
                const dateA = parseDateTime(a.datetime);
                const dateB = parseDateTime(b.datetime);
                return dateA - dateB;
            });
            
            // Group by date
            const groupedByDate = {};
            allMatches.forEach(match => {
                const datePart = match.datetime.split(' - ')[0];
                if (!groupedByDate[datePart]) {
                    groupedByDate[datePart] = [];
                }
                groupedByDate[datePart].push(match);
            });
            
            // Render HTML
            if (Object.keys(groupedByDate).length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-400">Nenhum jogo registrado ainda.</div>';
                return;
            }
            
            container.innerHTML = Object.entries(groupedByDate).map(([date, matches]) => {
                const [day, month, year] = date.split('/');
                const dateObj = new Date(year, month - 1, day);
                const dayName = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'][dateObj.getDay()];
                const monthName = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][dateObj.getMonth()];
                
                return `
                    <div class="glass-card rounded-2xl p-4 sm:p-6 shadow-xl">
                        <div class="flex items-center gap-3 pb-4 border-b border-slate-700/40 mb-4">
                            <span class="w-1 h-6 bg-blue-500 rounded-full"></span>
                            <h3 class="text-lg font-bold text-slate-100">${dayName}, ${day} de ${monthName} de ${year}</h3>
                        </div>
                        <div class="space-y-3">
                            ${matches.map(match => {
                                const [time] = match.datetime.split(' - ').pop().split(':');
                                const timePart = match.datetime.split(' - ')[1];
                                const scoreDisplay = match.scoreA !== null && match.scoreB !== null 
                                    ? `${match.scoreA} x ${match.scoreB}`
                                    : '-';
                                const resultClass = match.scoreA !== null && match.scoreB !== null
                                    ? 'text-emerald-400'
                                    : 'text-slate-400';
                                
                                return `
                                    <div class="flex items-center justify-between p-3 bg-copaNavy-accent/40 rounded-lg hover:bg-copaNavy-accent/60 transition-colors duration-200 border border-slate-700/30">
                                        <div class="flex items-center gap-2 flex-1 min-w-0">
                                            <span class="text-xs font-bold text-amber-400 bg-amber-400/10 px-2 py-1 rounded whitespace-nowrap">${timePart}</span>
                                            <div class="text-xs text-slate-400 px-2 py-1 bg-slate-800/40 rounded whitespace-nowrap">${match.stage}</div>
                                        </div>
                                        <div class="flex items-center gap-3 flex-1 min-w-0">
                                            <div class="flex items-center gap-1 min-w-0 flex-1 text-right">
                                                <span class="text-sm font-semibold text-slate-100 text-right truncate">${match.teamA.name}</span>
                                                <span class="text-xs text-slate-400">${match.teamA.flag}</span>
                                            </div>
                                            <div class="text-sm font-bold ${resultClass} min-w-fit">${scoreDisplay}</div>
                                            <div class="flex items-center gap-1 min-w-0 flex-1">
                                                <span class="text-xs text-slate-400">${match.teamB.flag}</span>
                                                <span class="text-sm font-semibold text-slate-100 truncate">${match.teamB.name}</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Start App fetching from Firebase
        initializeState();

    </script>
